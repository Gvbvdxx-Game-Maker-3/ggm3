<!DOCTYPE HTML>
<html>
    <head>
        <title>(((__HTMLTitle__)))</title>
        <link rel="icon" href="(((__HTMLFavicon__)))" />
    </head>
    <body>

        <style>
            body {
                background: rgb(0,0,0);
                color: rgb(255,255,255);
                font-family: arial;
            }

            #loadingscreen {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                display: flex;
                flex-direction: column;
                gap: 3px;
                align-items: center;
            }

            #loadingbar {
                background: rgb(0,0,0);
                padding: 2px 2px;
                border-radius: 0.5vmin;
                border-color: rgb(255,255,255);
                border-style: solid;
                border-width: 2px;
                box-sizing: border-box;
                width: 400px;
                height: 30px;
                overflow: hidden;
                position: relative;
            }
            #loadingbar-inner {
                box-sizing: border-box;
                border-radius: 0.5vmin;
                background: rgb(255,255,255);
                width: 0%;
                height: 100%;
            }
            #loadingbar-innertext {
                position: absolute;
                top: 50%;
                left: 3px;
                color: rgb(100,100,100);
                font-size: 15px;
                transform: translate(0, -50%);
                font-weight: bold;
            }

            #loadingbar-innertext[error] {
                color: rgb(150,0,0);
            }

            #gameCanvas {
                background: rgb(255,255,255);
                image-rendering: pixelated;
                user-select: none;
                width: 640px;
                height: 360px;
            }

            #gameContent {
                display: block;
                overflow: hidden;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }

            #clicktostart {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-weight: bold;
            }

            #clicktostart-button {
                all: unset;
                box-sizing: border-box;
                display: flex;
                font-weight: bold;
                color: rgb(255,255,255);
                background: rgba(0, 0, 0, 0);
                border-radius: 50%;
                border-style: solid;
                border-width: 6px;
                border-color: rgb(255,255,255);
                padding: 5px 5px;
                width: fit-content;
                height: fit-content;
                transition: 0.2s;
            }

            #clicktostart-button:hover {
                cursor: pointer;
            }

            #clicktostart-button > svg {
                width: 80px;
                height: 80px;
                pointer-events: none;
                user-select: none;
                transition: 0.2s;
            }

            #clicktostart-button:hover > svg {
                transform: scale(1.3);
            }
        </style>
        <style>
            [hidden] {
                display: none !important;
            }
        </style>

        <div id="gameContent" hidden>
            <canvas id="gameCanvas"></canvas>
        </div>

        <div id="loadingscreen">
            <div id="loadingbar">
                <div id="loadingbar-inner"></div>
                <span id="loadingbar-innertext">Loading...</span>
            </div>
        </div>

        <div id="clicktostart" hidden>
            <button id="clicktostart-button">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF">
                    <path d="M320-200v-560l440 280-440 280Zm80-280Zm0 134 210-134-210-134v268Z"/>
                </svg>
            </button>
        </div>

        <script src="engine.js"></script>
        <script src="game.js"></script>
        <script src="runtime.js"></script>
    </body>
</html>
